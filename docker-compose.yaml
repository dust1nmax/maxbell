# yaml 配置
version: "3.7"
services:
  maxbell:
    image: "mysql:latest"
    ports:
      - "33061:3306"
    command: "--default-authentication-plugin=mysql_native_password --init-file /data/application/init.sql"
    environment:
      MYSQL_ROOT_PASSWORD: "1111"
      MYSQL_DATABASE: "maxbell"
      MYSQL_PASSWORD: "root1234"
    volumes:
      - ./init.sql:/data/application/init.sql
  redis_demo:
    image: "redis:latest"
    ports:
      - "26379:6379"
  Maxbell:
    build: .
    command: sh -c "./wait-for.sh maxbell:3306 redis_demo:6379 -- ./maxbell ./conf/config.yaml"
    depends_on:
      - mysql8019
    ports:
      - "8888:8888"
